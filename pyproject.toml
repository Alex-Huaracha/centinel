[project]
name = "centinel"
version = "0.1.0"
description = "AI-powered personal expense tracker that reads bank and store emails and reports through Telegram"
readme = "README.md"
authors = [
    { name = "Alex Huaracha", email = "129701149+Alex-Huaracha@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
centinel = "centinel:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
