[project]
name = "centinel"
version = "0.1.0"
description = "AI-powered personal expense tracker that reads bank and store emails and reports through Telegram"
readme = "README.md"
authors = [
    { name = "Alex Huaracha", email = "129701149+Alex-Huaracha@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.5",
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = [
    "."
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Alembic generates these files from its own template
extend-exclude = ["migrations"]

[tool.pyrefly]
preset = "default"
