[project]
name = "centinel"
version = "0.1.0"
description = "AI-powered personal expense tracker that reads bank and store emails and reports through Telegram"
readme = "README.md"
authors = [
    { name = "Alex Huaracha", email = "129701149+Alex-Huaracha@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = [
    "."
]
